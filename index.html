<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>企业相亲大厅 · 管理系统</title>
<style>
/* ============ 基础 ============ */
:root{
  --bg0:#030617; --bg1:#0a0f2e; --bg2:#160b3a;
  --cyan:#5fe8ff; --blue:#6b8cff; --violet:#a06bff; --pink:#ff6fd8;
  --gold:#ffd98a; --ink:#eaf2ff; --dim:#8ea3cc;
  --glass:rgba(14,24,64,.62); --line:rgba(120,180,255,.28);
  --ok:#7dffc4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:var(--bg0); color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  user-select:none;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
.stage{position:fixed;inset:0;overflow:hidden;isolation:isolate}

/* ============ 背景层 ============ */
.bg{position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(120% 80% at 50% 8%, rgba(96,80,220,.42), transparent 60%),
    radial-gradient(70% 60% at 8% 65%, rgba(20,130,220,.28), transparent 65%),
    radial-gradient(70% 60% at 92% 65%, rgba(180,50,190,.24), transparent 65%),
    linear-gradient(180deg,#050a22 0%,#0a0b28 40%,#120a30 72%,#03040f 100%);
}
#stars{position:absolute;inset:0;width:100%;height:100%;z-index:1;opacity:.9}
.galaxy{position:absolute;left:50%;top:9%;width:min(74vw,900px);aspect-ratio:2.5/1;
  transform:translateX(-50%);z-index:1;pointer-events:none;opacity:.85;
  border-radius:50%;
  background:
    radial-gradient(ellipse at 50% 50%, rgba(150,110,255,.05) 0 28%, transparent 30%),
    repeating-radial-gradient(ellipse at 50% 50%, transparent 0 14px, rgba(140,190,255,.10) 15px 16px, transparent 17px 30px);
  filter:drop-shadow(0 0 26px rgba(110,150,255,.55));
  animation:spinSlow 60s linear infinite;
}
.galaxy::after{content:"";position:absolute;inset:-4%;border-radius:50%;
  border:2px solid rgba(140,190,255,.35);
  box-shadow:0 0 40px rgba(110,150,255,.5),inset 0 0 40px rgba(160,100,255,.45);
  transform:rotate(-14deg) scaleY(.42);}
@keyframes spinSlow{to{transform:translateX(-50%) rotate(360deg)}}
.arch{position:absolute;left:50%;top:-6%;width:min(96vw,1180px);height:58%;
  transform:translateX(-50%);z-index:1;pointer-events:none;
  border:2px solid rgba(255,215,140,.22);border-bottom-color:rgba(120,190,255,.35);
  border-radius:50% 50% 0 0/70% 70% 0 0;
  box-shadow:0 0 60px rgba(120,160,255,.18), inset 0 0 80px rgba(120,80,220,.18);}
.floor{position:absolute;left:-20%;right:-20%;bottom:-6%;height:46%;z-index:1;pointer-events:none;
  transform:perspective(500px) rotateX(66deg);transform-origin:50% 100%;
  background:
    linear-gradient(90deg,rgba(110,180,255,.16) 1px,transparent 1px) 0 0/64px 64px,
    linear-gradient(0deg,rgba(110,180,255,.16) 1px,transparent 1px) 0 0/64px 64px,
    radial-gradient(ellipse at 50% 0%,rgba(120,150,255,.35),transparent 65%);
  mask-image:linear-gradient(0deg,#000 10%,transparent 92%);}
.scanline{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.16;
  background:repeating-linear-gradient(0deg,rgba(160,210,255,.18) 0 1px,transparent 1px 4px);
  animation:scan 9s linear infinite;}
@keyframes scan{to{background-position:0 400px}}
.vignette{position:absolute;inset:0;z-index:2;pointer-events:none;
  box-shadow:inset 0 0 180px 50px rgba(0,0,10,.85)}

/* ============ HUD ============ */
.hud{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;justify-content:space-between;
  align-items:center;padding:10px 18px;font-size:11px;letter-spacing:.14em;color:var(--dim);
  background:linear-gradient(180deg,rgba(3,7,25,.86),transparent);}
.hud b{color:var(--cyan);font-weight:600}
.hud .grp{display:flex;gap:16px;align-items:center;white-space:nowrap}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 10px var(--ok);margin-right:6px;animation:blink 1.8s infinite}
@keyframes blink{50%{opacity:.35}}
.hud button{border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:11px;
  color:var(--cyan);background:rgba(20,40,90,.4);letter-spacing:.1em}
.hud button:hover{background:rgba(60,120,220,.35)}

/* ============ 标题 ============ */
.title-wrap{position:absolute;left:50%;top:5.2%;transform:translateX(-50%);z-index:12;text-align:center;width:min(92vw,760px)}
.title-plate{position:relative;padding:10px 34px 12px;border-radius:14px;
  border:1px solid rgba(255,215,140,.42);
  background:linear-gradient(180deg,rgba(18,16,52,.82),rgba(8,12,40,.72));
  box-shadow:0 0 34px rgba(120,140,255,.35),inset 0 0 26px rgba(255,200,120,.08);}
.title-plate::before,.title-plate::after{content:"◆";position:absolute;top:50%;transform:translateY(-50%);
  color:var(--gold);font-size:12px;opacity:.8}
.title-plate::before{left:12px}.title-plate::after{right:12px}
h1{margin:0;font-size:clamp(22px,4.4vw,44px);letter-spacing:.22em;font-weight:800;
  background:linear-gradient(180deg,#fff4d6,#ffd98a 45%,#e9a94b);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 26px rgba(255,200,110,.35)}
.sub{margin-top:5px;font-size:clamp(9px,1.5vw,13px);letter-spacing:.32em;color:#bcd0ff;opacity:.9}
.sub span{color:var(--gold);margin:0 6px}

/* ============ 中央舞台 ============ */
.center{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);z-index:8;
  width:min(46vw,560px);height:44%;pointer-events:none}
.city{position:absolute;left:0;right:0;bottom:8%;height:52%;opacity:.55;
  background:
    linear-gradient(180deg,transparent,rgba(70,120,255,.18)),
    repeating-linear-gradient(90deg,rgba(130,190,255,.55) 0 3px,transparent 3px 15px);
  mask-image:linear-gradient(0deg,#000 5%,transparent 95%);
  clip-path:polygon(0 100%,0 62%,4% 62%,4% 48%,8% 48%,8% 70%,12% 70%,12% 38%,16% 38%,16% 58%,21% 58%,21% 28%,25% 28%,25% 64%,30% 64%,30% 44%,34% 44%,34% 72%,39% 72%,39% 34%,43% 34%,43% 60%,48% 60%,48% 22%,52% 22%,52% 60%,57% 60%,57% 40%,61% 40%,61% 68%,66% 68%,66% 30%,70% 30%,70% 56%,75% 56%,75% 46%,79% 46%,79% 66%,84% 66%,84% 36%,88% 36%,88% 58%,93% 58%,93% 50%,100% 50%,100% 100%);
  filter:drop-shadow(0 0 12px rgba(100,180,255,.6))}
.heart{position:absolute;left:50%;top:24%;width:min(19vw,190px);aspect-ratio:1.15;
  transform:translateX(-50%);filter:drop-shadow(0 0 18px rgba(255,110,215,.9));
  animation:heartBeat 2.6s ease-in-out infinite}
@keyframes heartBeat{0%,100%{transform:translateX(-50%) scale(1);opacity:.9}18%{transform:translateX(-50%) scale(1.09);opacity:1}36%{transform:translateX(-50%) scale(1)}54%{transform:translateX(-50%) scale(1.06)}}
.ring{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%) rotateX(72deg);
  border-radius:50%;border:2px solid rgba(120,210,255,.55);
  box-shadow:0 0 26px rgba(90,180,255,.7),inset 0 0 22px rgba(160,100,255,.5);
  animation:ringPulse 3.4s ease-in-out infinite}
.ring.r1{width:64%;aspect-ratio:1}.ring.r2{width:86%;aspect-ratio:1;animation-delay:.6s;border-color:rgba(255,130,220,.4)}
.ring.r3{width:108%;aspect-ratio:1;animation-delay:1.2s;border-color:rgba(255,215,140,.3)}
@keyframes ringPulse{0%,100%{opacity:.35;transform:translate(-50%,-50%) rotateX(72deg) scale(.94)}50%{opacity:1;transform:translate(-50%,-50%) rotateX(72deg) scale(1.04)}}
.bot{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:74px;z-index:3;
  filter:drop-shadow(0 0 14px rgba(160,230,255,.85))}
.table{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:78%;height:20%;
  border-radius:50%;background:radial-gradient(ellipse at 50% 20%,rgba(190,220,255,.35),rgba(40,60,140,.55) 55%,rgba(10,15,45,.9));
  border:1px solid rgba(160,210,255,.5);box-shadow:0 0 40px rgba(100,150,255,.45),inset 0 0 30px rgba(255,255,255,.12)}
.table::after{content:"";position:absolute;inset:14% 12%;border-radius:50%;border:1px dashed rgba(255,215,140,.45)}
.bubble{position:absolute;left:50%;top:30%;transform:translate(-50%,-10px);z-index:5;
  padding:7px 14px;border-radius:14px;font-size:12px;white-space:nowrap;
  background:rgba(12,26,66,.92);border:1px solid rgba(120,220,255,.55);
  box-shadow:0 0 22px rgba(90,190,255,.4);opacity:0;transition:.35s;color:#dff4ff}
.bubble.show{opacity:1;transform:translate(-50%,-22px)}
.flash{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 48%,rgba(255,255,255,.55),rgba(120,180,255,.25) 35%,transparent 70%)}
.flash.go{animation:flashAnim .7s ease-out}
@keyframes flashAnim{0%{opacity:.9}100%{opacity:0}}

/* ============ 左右显示屏 ============ */
.screen{position:absolute;top:24%;z-index:14;width:min(19.5vw,252px);
  border-radius:16px;padding:12px 14px 14px;
  background:linear-gradient(160deg,rgba(18,30,78,.78),rgba(8,12,40,.72));
  border:1px solid var(--line);backdrop-filter:blur(9px);
  box-shadow:0 0 32px rgba(70,120,255,.28),inset 0 0 30px rgba(90,140,255,.09)}
.screen.left{left:2.2%}.screen.right{right:2.2%}
.screen::before{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(150,210,255,.05) 0 1px,transparent 1px 3px)}
.screen.flash-in{animation:screenFlash .75s ease-out}
@keyframes screenFlash{0%{box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 60px rgba(140,220,255,.9)}100%{box-shadow:0 0 32px rgba(70,120,255,.28)}}
.sc-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:9px;
  padding-bottom:8px;border-bottom:1px solid rgba(130,180,255,.22)}
.sc-head h2{margin:0;font-size:12px;letter-spacing:.12em;color:#e7f2ff;font-weight:700}
.sc-head .tag{font-size:9px;letter-spacing:.12em;color:var(--cyan);
  border:1px solid rgba(95,232,255,.4);border-radius:10px;padding:2px 7px;white-space:nowrap}
.sc-body{min-height:200px;position:relative}
/* 默认列表 */
.rank-list{display:flex;flex-direction:column;gap:5px}
.rank-row{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:9px;
  font-size:11px;color:#c9d8f5;background:rgba(255,255,255,.025);transition:.3s}
.rank-row .num{width:16px;color:var(--gold);font-weight:700;font-size:10px;text-align:center}
.rank-row .lg{width:20px;height:20px;flex:0 0 20px;border-radius:6px;display:grid;place-items:center;
  font-size:9px;font-weight:800;color:#06122c}
.rank-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-row .mini{font-size:9px;color:var(--dim)}
.rank-row.on{background:linear-gradient(90deg,rgba(95,232,255,.2),rgba(160,107,255,.12));
  border:1px solid rgba(120,230,255,.5);color:#fff;box-shadow:0 0 16px rgba(95,232,255,.28)}
.sc-note{margin-top:9px;font-size:9.5px;line-height:1.6;color:var(--dim);letter-spacing:.04em}
/* 锁定档案 */
.dossier{animation:fadeUp .5s ease-out both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.dos-top{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.dos-logo{width:46px;height:46px;flex:0 0 46px;border-radius:13px;display:grid;place-items:center;
  font-size:16px;font-weight:900;color:#06122c;box-shadow:0 0 22px currentColor}
.dos-name{font-size:14px;font-weight:800;line-height:1.3}
.dos-en{font-size:9px;letter-spacing:.18em;color:var(--dim);margin-top:3px}
.dos-slogan{font-size:10.5px;line-height:1.65;color:#c6d8ff;margin:8px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.chip{font-size:9px;padding:3px 8px;border-radius:20px;color:#dff2ff;
  border:1px solid rgba(120,190,255,.4);background:rgba(90,150,255,.12)}
.meter{margin-bottom:4px}
.meter .lab{display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim);margin-bottom:5px}
.meter .lab b{color:var(--ok);font-size:12px}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:6px;
  background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));
  box-shadow:0 0 12px rgba(120,220,255,.8);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.stat{background:rgba(255,255,255,.04);border:1px solid rgba(130,180,255,.16);border-radius:8px;
  padding:7px 4px;text-align:center}
.stat b{display:block;font-size:12px;color:#eaf6ff}
.stat span{font-size:8.5px;color:var(--dim)}
.match-big{text-align:center;padding:8px 0 4px}
.match-big .v{font-size:38px;font-weight:900;line-height:1;
  background:linear-gradient(180deg,#fff,#7dffc4);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 24px rgba(125,255,196,.35)}
.match-big .v small{font-size:14px}
.match-big .t{font-size:9.5px;letter-spacing:.2em;color:var(--dim);margin-top:5px}
.radar-txt{font-size:10px;line-height:1.7;color:#c9dcf8;margin:9px 0}
.radar-txt em{color:var(--gold);font-style:normal}
.cta{width:100%;margin-top:8px;padding:9px;border-radius:10px;font-size:11px;letter-spacing:.16em;
  color:#04122a;font-weight:800;
  background:linear-gradient(90deg,var(--cyan),#a9b6ff,var(--pink));
  box-shadow:0 0 20px rgba(120,200,255,.5);transition:.2s}
.cta:hover{filter:brightness(1.15);transform:translateY(-1px)}
.cta:active{transform:scale(.97)}
.locked-banner{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:9px;
  font-size:9px;letter-spacing:.18em;color:var(--ok)}
.locked-banner i{width:5px;height:5px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}

/* ============ 底部展示区 ============ */
.deck{position:absolute;left:0;right:0;bottom:0;z-index:18;
  padding:0 0 max(10px,env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,rgba(3,7,24,.75) 18%,rgba(3,6,20,.96));}
.deck-head{display:flex;align-items:center;gap:10px;padding:10px 18px 6px}
.deck-head h3{margin:0;font-size:13px;letter-spacing:.16em;
  background:linear-gradient(90deg,#ffe6ae,#ffc46b);-webkit-background-clip:text;background-clip:text;color:transparent}
.deck-head .hint{font-size:10px;color:var(--dim);letter-spacing:.06em;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deck-head .arrows{display:flex;gap:6px}
.deck-head .arrows button{width:28px;height:28px;border-radius:8px;font-size:14px;color:var(--cyan);
  border:1px solid var(--line);background:rgba(20,40,90,.5)}
.deck-head .arrows button:hover{background:rgba(80,140,230,.4)}
.track-wrap{position:relative}
.track{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding:6px 18px 14px;
  scroll-snap-type:x proximity;scrollbar-width:none;touch-action:pan-x pan-y;cursor:grab}
.track::-webkit-scrollbar{display:none}
.track.dragging{cursor:grabbing;scroll-snap-type:none}
.card{position:relative;flex:0 0 210px;scroll-snap-align:center;border-radius:14px;padding:12px;
  background:linear-gradient(165deg,rgba(22,34,82,.86),rgba(9,13,42,.9));
  border:1px solid rgba(130,180,255,.3);
  box-shadow:0 0 18px rgba(60,110,220,.18),inset 0 0 20px rgba(100,150,255,.06);
  transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s,border-color .28s;
  overflow:hidden}
.card::before{content:"";position:absolute;left:-40%;top:-60%;width:60%;height:220%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);
  transform:rotate(18deg);transition:left .6s;pointer-events:none}
.card:hover::before,.card.focus::before{left:130%}
.card:hover,.card.focus{transform:translateY(-8px);border-color:rgba(140,225,255,.75);
  box-shadow:0 10px 34px rgba(80,160,255,.35),0 0 24px rgba(120,220,255,.25)}
.card.locked{border-color:var(--ok);
  box-shadow:0 0 0 1px var(--ok),0 0 34px rgba(125,255,196,.42);
  animation:lockPop .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes lockPop{0%{transform:scale(.94)}60%{transform:scale(1.04) translateY(-8px)}100%{transform:translateY(-8px) scale(1)}}
.card .corner{position:absolute;right:9px;top:9px;font-size:8px;letter-spacing:.14em;color:var(--dim)}
.card .row1{display:flex;gap:9px;align-items:center;margin-bottom:9px}
.card .logo{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;
  font-size:13px;font-weight:900;color:#06122c;box-shadow:0 0 16px currentColor}
.card .cn{font-size:12.5px;font-weight:800;line-height:1.25}
.card .en{font-size:8.5px;letter-spacing:.14em;color:var(--dim);margin-top:3px}
.card .desc{font-size:10px;line-height:1.6;color:#bdcff0;height:48px;overflow:hidden}
.card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:6px}
.card .score{font-size:9px;color:var(--dim)}
.card .score b{color:var(--ok);font-size:12px}
.card .view{padding:5px 13px;border-radius:20px;font-size:10px;letter-spacing:.1em;
  color:#bfe9ff;border:1px solid rgba(120,210,255,.45);background:rgba(60,130,220,.18);transition:.2s}
.card .view:hover{background:rgba(100,190,255,.4);color:#fff;box-shadow:0 0 14px rgba(120,210,255,.5)}
.progress{height:3px;margin:0 18px 6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.progress i{display:block;height:100%;width:22%;border-radius:3px;
  background:linear-gradient(90deg,var(--cyan),var(--pink));transition:width .15s}

/* ============ 中央浮动提示 ============ */
.toast{position:absolute;left:50%;top:70%;transform:translate(-50%,10px);z-index:30;
  padding:9px 20px;border-radius:24px;font-size:12px;letter-spacing:.14em;white-space:nowrap;
  background:rgba(8,20,54,.9);border:1px solid rgba(125,255,196,.55);color:var(--ok);
  box-shadow:0 0 26px rgba(80,220,180,.35);opacity:0;pointer-events:none;transition:.35s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ 响应式 ============ */
@media (max-width:900px){
  .screen{top:auto;bottom:calc(210px + env(safe-area-inset-bottom));width:calc(50% - 16px);
    padding:9px 10px;border-radius:12px}
  .screen.left{left:8px}.screen.right{right:8px}
  .sc-body{min-height:0;max-height:128px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
  .sc-body::-webkit-scrollbar{display:none}
  .sc-head{margin-bottom:6px;padding-bottom:5px}
  .sc-head h2{font-size:10px}.sc-head .tag{display:none}
  .rank-row{padding:3px 5px;font-size:9.5px;gap:5px}
  .rank-list{gap:2px}
  .sc-note,.dos-slogan,.chips,.stats,.radar-txt,.cta,.locked-banner,.meter .lab{display:none}
  .dos-top{margin-bottom:4px;gap:7px}
  .dos-logo{width:30px;height:30px;flex:0 0 30px;font-size:11px;border-radius:9px}
  .dos-name{font-size:11px}
  .dos-en{font-size:8px}
  .meter{margin-top:7px}
  .match-big .v{font-size:26px}.match-big{padding:2px 0}
  .match-big .t{font-size:8px}
  .center{top:33%;width:86vw;height:32%}
  .title-wrap{top:4.5%}
  .title-plate{padding:8px 22px 9px}
  .deck-head{padding:8px 12px 4px}
  .deck-head h3{font-size:11px}
  .deck-head .hint{font-size:9px}
  .track{gap:9px;padding:5px 12px 10px}
  .card{flex:0 0 176px;padding:10px}
  .card .desc{height:42px;font-size:9.5px}
  .toast{top:62%;font-size:10px;padding:7px 14px}
  .floor{height:40%}
}
@media (max-height:560px){
  .screen{bottom:calc(178px + env(safe-area-inset-bottom))}
  .sc-body{max-height:84px}
  .center{height:28%;top:31%}
}
</style>
</head>
<body>
<div class="stage">
  <div class="bg"></div>
  <canvas id="stars"></canvas>
  <div class="galaxy"></div>
  <div class="arch"></div>
  <div class="floor"></div>
  <div class="scanline"></div>
  <div class="vignette"></div>
  <div class="flash" id="flash"></div>

/* ================= 交互：hover / 单击聚焦 / 双击锁定 ================= */
let lastTap = {i:-1, t:0};
cards.forEach((card,i)=>{
  card.addEventListener('mouseenter', ()=>{
    focusedIdx = i;
    if(locked===null) hint.textContent = `预览：${COMPANIES[i].cn} · 双击锁定投屏`;
  });
  card.addEventListener('mouseleave', ()=>{
    if(locked===null) hint.textContent = '← 左右滑动查看更多 · 悬停查看 · 双击 / 连点两次锁定投屏 →';
  });
  card.addEventListener('focus', ()=>{ focusedIdx = i; });
  card.addEventListener('dblclick', e=>{ e.preventDefault(); lock(i); });
  card.addEventListener('click', e=>{
    if(dragMoved){ dragMoved=false; return; }
    if(e.target.closest('[data-view]')){ lock(i); return; }
    focusedIdx = i;
    card.classList.add('focus');
    setTimeout(()=>card.classList.remove('focus'), 1200);
    hint.textContent = `已聚焦 ${COMPANIES[i].cn} · 再点一次 / 双击即可锁定投屏`;
  });
  /* 移动端连点两次 = 双击（带移动距离判定，避免滑动误触） */
  let dx=0, dy=0, moved=false;
  card.addEventListener('pointerdown', e=>{ dx=e.clientX; dy=e.clientY; moved=false; });
  card.addEventListener('pointermove', e=>{
    if(Math.abs(e.clientX-dx)>9 || Math.abs(e.clientY-dy)>9) moved=true;
  });
  card.addEventListener('pointerup', e=>{
    if(e.pointerType==='mouse' || moved) return;
    const now = Date.now();
    if(lastTap.i===i && now-lastTap.t < 340){ lock(i); lastTap={i:-1,t:0}; }
    else { lastTap={i, t:now}; }
  });

/* ================= 鼠标拖拽横滑 ================= */
let dragging=false, startX=0, startScroll=0, dragMoved=false;
track.addEventListener('pointerdown', e=>{
  if(e.pointerType!=='mouse') return;
  dragging=true; dragMoved=false; startX=e.clientX; startScroll=track.scrollLeft;
  track.classList.add('dragging');
});
window.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const d = e.clientX-startX;
  if(Math.abs(d)>5) dragMoved=true;
  track.scrollLeft = startScroll - d;
});
const endDrag = ()=>{ dragging=false; track.classList.remove('dragging'); };
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
track.addEventListener('wheel', e=>{
  if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){ track.scrollLeft += e.deltaY; e.preventDefault(); }
},{passive:false});
$('#prevBtn').onclick = ()=>track.scrollBy({left:-230,behavior:'smooth'});

/* ================= 提示 / 音效 / 粒子 ================= */
let toastTimer, bubbleTimer;
function showToast(t){ toast.textContent=t; toast.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove('show'),1900); }
function showBubble(t){ bubble.textContent=t; bubble.classList.add('show');
  clearTimeout(bubbleTimer); bubbleTimer=setTimeout(()=>bubble.classList.remove('show'),2800); }
$('#soundBtn').onclick = ()=>{ soundOn=!soundOn;
  $('#soundBtn').textContent = soundOn ? '🔊 音效' : '🔇 静音';
  if(soundOn) beep(880,.1); };
let actx=null;
function beep(freq,dur){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(.0001,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.12,actx.currentTime+.015);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur+.02);
  }catch(err){}
}

/* 星空 canvas */
const cv=$('#stars'), ctx=cv.getContext('2d');
let W,H,stars=[],sparks=[];
function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  stars=Array.from({length: Math.min(190, Math.floor(W*H/6500))},()=>({
    x:Math.random()*W,y:Math.random()*H*.8,r:Math.random()*1.4+.25,
    a:Math.random()*.7+.2,s:Math.random()*.012+.004,p:Math.random()*6.28
  }));
}
resize(); addEventListener('resize',resize);
function burst(){
  for(let i=0;i<46;i++) sparks.push({
    x:W/2,y:H*.46,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*5-1,
    life:1,hue:Math.random()*80+170,r:Math.random()*2.2+.7
  });
}
function loop(){
  ctx.clearRect(0,0,W,H);
  const t=performance.now()*.001;
  for(const s of stars){
    const a=s.a*(.55+.45*Math.sin(t*2+s.p));
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283);
    ctx.fillStyle=`rgba(200,225,255,${a})`; ctx.fill();
    s.y += s.s; if(s.y>H*.85){s.y=0;s.x=Math.random()*W;}
  }
  sparks=sparks.filter(p=>p.life>0);
  for(const p of sparks){
    p.x+=p.vx; p.y+=p.vy; p.vy+=.045; p.life-=.018;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283);
    ctx.fillStyle=`hsla(${p.hue},100%,75%,${p.life})`;
    ctx.shadowBlur=12; ctx.shadowColor=`hsla(${p.hue},100%,70%,${p.life})`;
    ctx.fill(); ctx.shadowBlur=0;
  }
  /* 偶发流星 */
  if(Math.random()<.004){
    const sx=Math.random()*W, sy=Math.random()*H*.35;
    const g=ctx.createLinearGradient(sx,sy,sx-90,sy+50);
    g.addColorStop(0,'rgba(190,230,255,.85)'); g.addColorStop(1,'rgba(190,230,255,0)');
    ctx.strokeStyle=g; ctx.lineWidth=1.4; ctx.beginPath();
    ctx.moveTo(sx,sy); ctx.lineTo(sx-90,sy+50); ctx.stroke();
  }
  requestAnimationFrame(loop);
}
loop();

/* 开场提示 */
setTimeout(()=>showToast('欢迎进入企业相亲大厅 ✦ 双击企业卡开始匹配'),650);
</script>
