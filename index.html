<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>梦想显化器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>𝕏</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei","Noto Naskh Arabic",sans-serif;background:#f1f5f9;color:#0f172a;line-height:1.5}
html[lang="ar"] body,html[dir="rtl"] body{direction:rtl;text-align:right}
html[lang="ar"] .sidebar,html[dir="rtl"] .sidebar{left:auto;right:0}
html[lang="ar"] .main,html[dir="rtl"] .main{margin-left:0;margin-right:240px}
html[lang="ar"] .skills-compact li,html[dir="rtl"] .skills-compact li{padding-left:0;padding-right:1em}
html[lang="ar"] .skills-compact li::before,html[dir="rtl"] .skills-compact li::before{left:auto;right:0}
@media (max-width:768px){
  html[lang="ar"] .main,html[dir="rtl"] .main{margin-right:0}
  html[lang="ar"] .sidebar,html[dir="rtl"] .sidebar{transform:translateX(100%)}
  html[lang="ar"] .sidebar.open,html[dir="rtl"] .sidebar.open{transform:translateX(0)}
  .sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}
  .main{margin-left:0}.fab-menu{display:block}
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit}
.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:linear-gradient(180deg,#0f172a,#1e293b);color:#e2e8f0;padding:16px 12px;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:40;transition:transform .25s}
.sidebar .logo{display:flex;align-items:center;gap:10px;padding:8px 10px 18px;font-weight:700;font-size:16px;color:#fbbf24}
.sidebar .logo span:first-child{width:32px;height:32px;border-radius:50%;background:#fbbf24;color:#0f172a;display:flex;align-items:center;justify-content:center;font-size:14px}
.menu-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;margin-bottom:2px;color:#cbd5e1}
.menu-item:hover,.menu-item.active{background:rgba(251,191,36,.15);color:#fbbf24}
.menu-item.admin-only{display:none}
.main{flex:1;margin-left:240px;min-width:0}
.topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;gap:8px;flex-wrap:wrap}
.user-area{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.user-info{display:flex;align-items:center;gap:8px;font-size:13px}
.content{padding:16px;max-width:1100px}
.view{display:none}.view.active{display:block}
.view-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.view-header h2{font-size:18px}
.btn{border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-primary{background:#2563eb;color:#fff}.btn-outline{background:#fff;border:1px solid #cbd5e1;color:#334155}
.btn-edit{background:#e0e7ff;color:#3730a3}.btn-del{background:#fee2e2;color:#b91c1c}
.btn-team{background:#d1fae5;color:#047857}.btn-caishen{background:#fce7f3;color:#9d174d}
.btn-survey{background:#ede9fe;color:#5b21b6}
.btn-bundle{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.btn-super-bundle{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff}
.btn-pulse-inline{background:#f43f5e;color:#fff}
.btn-success{background:#059669;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-icon-sm{width:32px;height:32px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;font-size:16px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.btn-icon-sm.active-reorg{background:#fef3c7;border-color:#f59e0b}
.jz-action-row{display:flex;flex-wrap:nowrap;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
.jz-action-row .btn{flex-shrink:0;white-space:nowrap}
.search-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.search-bar input,.search-bar select{flex:1;min-width:120px;padding:10px 14px;border:1px solid #cbd5e1;border-radius:24px;font-size:14px;outline:none;background:#fff}
.search-bar select{border-radius:10px;max-width:200px}
.pager{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:16px;flex-wrap:wrap;font-size:14px}
.pager a,.pager span{padding:6px 12px;border-radius:4px;color:#1a0dab}
.pager .cur{color:#000;font-weight:700}.pager .disabled{color:#9ca3af}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin-bottom:12px;display:flex;gap:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.avatar-jinzhu{background:linear-gradient(135deg,#f59e0b,#d97706)}
.avatar-dashi{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}
.avatar-hero{background:linear-gradient(135deg,#ec4899,#be185d)}
.avatar-team{background:linear-gradient(135deg,#10b981,#047857)}
.avatar-diag{background:linear-gradient(135deg,#0ea5e9,#0369a1)}
.avatar-cat{background:linear-gradient(135deg,#64748b,#334155)}
.avatar-pulse{background:linear-gradient(135deg,#f43f5e,#e11d48)}
.avatar-coop{background:linear-gradient(135deg,#14b8a6,#0f766e)}
.avatar-case{background:linear-gradient(135deg,#a855f7,#7c3aed)}
.card-content{flex:1;min-width:0}
.card-title{font-weight:600;font-size:15px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:4px}
.jz-name-line,.si-name-line{font-size:16px;font-weight:700;color:#0f172a;margin:2px 0 6px;word-break:break-word}
.jz-title-line{font-size:14px;font-weight:600;color:#334155;margin-bottom:4px}
.card-desc{font-size:13px;color:#475569;margin-bottom:4px;word-break:break-word}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500;background:#f1f5f9;color:#475569}
.tag-power{background:#fef3c7;color:#b45309}.tag-sub{background:#e0e7ff;color:#3730a3;margin:2px}
.tag-tool{background:#ede9fe;color:#5b21b6;margin:2px;cursor:pointer}
.tag-reject{background:#fee2e2;color:#b91c1c;margin:2px}
.home-cat-tag{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;cursor:pointer;background:#f1f5f9;color:#334155;border:1px solid #e2e8f0}
.home-cat-tag:hover{background:#e0e7ff}.home-cat-tag.active{background:#2563eb;color:#fff;border-color:#2563eb}
.match-banner,.focus-banner{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:13px}
.empty-tip{text-align:center;color:#94a3b8;padding:40px 16px;font-size:14px}
.role-badge{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
.role-jinzhu{background:#fef3c7;color:#b45309}.role-ai{background:#ede9fe;color:#6d28d9}
.role-admin{background:#fee2e2;color:#b91c1c}.role-yingxiao{background:#fce7f3;color:#9d174d}
.motto-box{background:#faf5ff;border:1px solid #e9d5ff;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13px;color:#6b21a8;font-style:italic}
.skills-compact{margin:8px 0 10px;font-size:13px;line-height:1.55;color:#334155}
.skills-compact .skills-head{font-weight:600;color:#0f172a;margin-bottom:4px}
.skills-compact ul{list-style:none;padding:0;margin:0}
.skills-compact li{position:relative;padding-left:1em;margin:2px 0;word-break:break-word}
.skills-compact li::before{content:'•';position:absolute;left:0;top:0;color:#64748b;font-weight:700}
.skills-compact .sk-name{font-weight:600}.skills-compact .sk-desc{color:#475569}
.biz-card{display:flex;gap:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-top:8px;font-size:12px;flex-wrap:wrap}
.biz-info{flex:1;min-width:180px;line-height:1.7}
.biz-info .biz-name{font-size:14px;font-weight:600;color:#0f172a;margin-bottom:4px}
.biz-row{display:flex;gap:6px;flex-wrap:wrap}.biz-row .k{color:#64748b;min-width:3.5em}
.biz-row a{color:#2563eb;word-break:break-all}
.qr-box img{width:88px;height:88px;border-radius:8px;border:1px solid #e2e8f0;object-fit:cover}
.form-section-title{font-size:13px;font-weight:700;color:#334155;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid #e2e8f0}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.form-grid-2{grid-template-columns:1fr}}
.demand-type-pick{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.demand-type-btn{flex:1;min-width:120px;padding:14px 12px;border:2px solid #e2e8f0;border-radius:12px;background:#fff;cursor:pointer;text-align:center;font-size:14px;font-weight:600;color:#475569}
.demand-type-btn.active-dream{border-color:#ec4899;background:#fdf2f8;color:#9d174d}
.demand-type-btn.active-problem{border-color:#0ea5e9;background:#f0f9ff;color:#0369a1}
.demand-type-btn small{display:block;font-weight:400;font-size:11px;margin-top:4px;opacity:.8}
.piece-line{margin:4px 0;font-size:13px;padding:6px 10px;background:#f0f9ff;border-radius:8px;border-left:3px solid #38bdf8}
.piece-line.dream{background:#fdf2f8;border-left-color:#f472b6}
.pain-line{margin:4px 0;font-size:13px;padding:6px 10px;background:#fef2f2;border-radius:8px;border-left:3px solid #f87171}
.team-box{background:#f0f9ff;border:1px solid #bae6fd;border-radius:12px;padding:12px;margin-top:10px}
.team-title{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.member-list{display:flex;flex-wrap:wrap;gap:8px}
.member-chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #e2e8f0;border-radius:999px;padding:4px 10px 4px 4px;font-size:12px}
.member-chip img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#e2e8f0}
.member-chip .power-icon{color:#b45309;font-weight:600}
.member-x,.bundle-x{width:22px;height:22px;border-radius:50%;border:none;background:#fee2e2;color:#b91c1c;cursor:pointer;font-size:14px;line-height:1;opacity:0;display:inline-flex;align-items:center;justify-content:center}
.team-show-kick .member-x,.team-show-case .bundle-x.case-x,.team-show-survey .bundle-x.survey-x{opacity:1}
.bundle-chip{display:inline-flex;align-items:center;gap:4px}
.bundle-box{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px}
.bundle-box h5{font-size:13px;margin-bottom:6px;color:#92400e}
.bundle-row{margin:4px 0;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.progress-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px}
.progress-box h5{font-size:13px;margin:0 0 8px;color:#0f172a;display:flex;align-items:center;justify-content:space-between;gap:6px}
.progress-box textarea{width:100%;min-height:88px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;resize:vertical}
.progress-box .progress-view{white-space:pre-wrap;word-break:break-word;color:#334155;line-height:1.55;min-height:1.5em}
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal.wide{max-width:820px}
.modal h3{margin-bottom:14px;font-size:17px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:4px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:9px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px}
.form-group textarea{min-height:72px;resize:vertical}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.dynamic-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:10px;position:relative}
.remove-btn{position:absolute;top:8px;right:8px}
html[lang="ar"] .remove-btn,html[dir="rtl"] .remove-btn{right:auto;left:8px}
.msg-type{font-size:11px;background:#e0e7ff;color:#3730a3;padding:2px 6px;border-radius:4px;margin-right:6px}
.pulse-tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.pulse-tab{padding:8px 14px;border-radius:999px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;font-size:13px}
.pulse-tab.active{background:#2563eb;color:#fff;border-color:#2563eb}
.lang-hint{font-size:12px;color:#64748b;margin-bottom:10px;padding:8px;background:#f8fafc;border-radius:8px}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
.sidebar-overlay.open{display:block}
.fab-menu{display:none;position:fixed;bottom:20px;right:16px;z-index:50}
.fab-menu button{width:48px;height:48px;border-radius:50%;border:none;background:#0f172a;color:#fbbf24;font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.x-actions{display:flex;gap:6px;margin-top:8px}
.x-icon{width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;font-size:14px;background:#f1f5f9}
.x-icon.pull{background:#dbeafe}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;border-bottom:1px solid #e2e8f0;text-align:left}
.badge-pending{background:#fef3c7;color:#b45309;padding:2px 8px;border-radius:999px;font-size:11px}
.badge-reviewing{background:#dbeafe;color:#1d4ed8;padding:2px 8px;border-radius:999px;font-size:11px}
.badge-completed{background:#d1fae5;color:#047857;padding:2px 8px;border-radius:999px;font-size:11px}
.badge-archived{background:#f1f5f9;color:#64748b;padding:2px 8px;border-radius:999px;font-size:11px}
.kyb-wrap{text-align:center;padding:24px 12px}
.kyb-step-icons{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.kyb-step-icon{position:relative;width:48px;height:48px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(251,191,36,.65);background:radial-gradient(circle at 30% 30%,#fde68a,#b45309);color:#1c1917;font-size:18px;text-decoration:none;cursor:pointer}
.kyb-step-icon .kyb-tip{pointer-events:none;position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(4px);background:rgba(15,23,42,.95);color:#f8fafc;padding:8px 12px;border-radius:8px;font-size:12px;white-space:nowrap;opacity:0;visibility:hidden;transition:.15s;z-index:5}
.kyb-step-icon:hover .kyb-tip,.kyb-step-icon:focus .kyb-tip{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.case-detail-section{margin-top:14px;padding-top:12px;border-top:1px solid #e2e8f0}
.case-related-tools{display:flex;flex-wrap:wrap;gap:6px}
.case-links-list{list-style:none;padding:0}.case-links-list a{color:#2563eb}
.si-verify-row{display:flex;gap:8px}.si-verify-row textarea{flex:1}
.case-extract-box{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px;color:#166534}
.diag-answer{margin:8px 0;padding:10px;background:#f8fafc;border-radius:8px}
.diag-answer .q{font-weight:600;margin-bottom:4px}.diag-answer .a{color:#475569}
#langSelect{padding:6px 10px;border-radius:8px;border:1px solid #cbd5e1;font-size:13px;background:#fff}
.copy-pick-list{max-height:220px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:10px}
.copy-pick-item{padding:10px 12px;border-bottom:1px solid #f1f5f9;cursor:pointer;font-size:13px}
.copy-pick-item:hover{background:#f8fafc}
.qgen-section{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:10px}
.qgen-q{display:flex;gap:8px;margin:6px 0;align-items:center}
.qgen-q input{flex:1}
</style>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="logo"><span>𝕏</span><span data-i18n="brand">梦想显化器</span></div>
    <div class="menu-item active" data-view="home" data-i18n="menu.home">🏠 首页</div>
    <div class="menu-item" data-view="kybalion" data-i18n="menu.kybalion">📖 宇宙法则指引</div>
    <div class="menu-item" data-view="focus" data-i18n="menu.focus">🎯 当前显化中心</div>
    <div class="menu-item" data-view="team" data-i18n="menu.team">👥 我的超级团队</div>
    <div class="menu-item" data-view="jinzhu" data-i18n="menu.jinzhu">💰 金主需求中心</div>
    <div class="menu-item" data-view="dashi" data-i18n="menu.dashi">🤖 超级智能中心</div>
    <div class="menu-item" data-view="sicase" data-i18n="menu.sicase">✨ SI 成功场景</div>
    <div class="menu-item" data-view="hero" data-i18n="menu.hero">⭐ 超级精英中心</div>
    <div class="menu-item" data-view="qgen" data-i18n="menu.qgen">📋 问卷生成中心</div>
    <div class="menu-item" data-view="diagnosis" data-i18n="menu.diagnosis">🔎 需求诊断中心</div>
    <div class="menu-item" data-view="inbox" data-i18n="menu.inbox">⚡ 脉冲互动中心</div>
    <div class="menu-item" data-view="coop" data-i18n="menu.coop">🤝 商务合作</div>
    <div class="menu-item admin-only" data-view="categories" data-i18n="menu.categories">🗂 大分类小分类</div>
    <div class="menu-item admin-only" data-view="coop-list" data-i18n="menu.coopList">🏢 商务合作中心</div>
    <div class="menu-item admin-only" data-view="users" data-i18n="menu.users">👤 用户管理</div>
  </div>
  <div class="main">
    <div class="topbar">
      <select id="langSelect" onchange="setLanguage(this.value)" aria-label="Language"></select>
      <div class="user-area" id="userArea"></div>
    </div>
    <div class="content">
      <div class="view active" id="view-home">
        <div class="view-header"><h2 data-i18n="home.siTools">超级智能工具</h2></div>
        <div class="search-bar">
          <input id="home-ds-q" data-i18n-placeholder="ph.homeSearch" oninput="homeDsPage=1;renderHome()">
          <button class="btn btn-outline btn-sm" type="button" onclick="toggleHomeCats()" data-i18n="home.allCats">全部工具大分类</button>
        </div>
        <div id="home-major-tags" style="display:none;flex-wrap:wrap;gap:8px;margin-bottom:8px"></div>
        <div id="home-minor-tags" style="display:none;flex-wrap:wrap;gap:8px;margin-bottom:12px"></div>
        <div id="home-dashi-list"></div>
        <div class="pager" id="home-ds-pager"></div>
      </div>
      <div class="view" id="view-kybalion">
        <div class="kyb-wrap">
          <div class="kyb-step-icons">
            <a class="kyb-step-icon" href="javascript:switchView('focus')" data-i18n-title="kyb.tip1">①<span class="kyb-tip" data-i18n="kyb.tip1">1. 宇宙法则指引方向</span></a>
            <a class="kyb-step-icon" href="javascript:switchView('dashi')" data-i18n-title="kyb.tip2">②<span class="kyb-tip" data-i18n="kyb.tip2">2. 超级智能零成本自动化执行</span></a>

function memberChipHtml(m,isOwner,teamId){if(!m)return '';let type=(m.type||'member')+'';if(type==='si'||type==='SI')type='dashi';if(type==='yingxiao'||type==='elite')type='hero';const isDashi=type==='dashi',isHero=type==='hero';const safeId=escapeAttr(String(m.id));const onClick=isDashi?`goMemberProfile('dashi','${safeId}')`:(isHero?`goMemberProfile('hero','${safeId}')`:'');const typeTag=isDashi?'SI':(isHero?'Elite':'M');const av=memberAvatarUrl(Object.assign({},m,{type}));return `<span class="member-chip"><img src="${av}" ${isDashi||isHero?`onclick="${onClick}" style="cursor:pointer"`:''} onerror="this.src='${DEFAULT_AVATAR}'"><span>${escapeHtml(m.name||m.id||'')}<small style="opacity:.75">(${typeTag})</small></span><span class="power-icon">⚡${Number(m.power)||0}</span>${isOwner?`<button class="member-x" onclick="kickMember(${teamId},'${safeId}')">×</button>`:''}</span>`;}
function isAlreadyInTeam(members,id){return !!(members&&members.some(m=>String(m.id)===String(id)));}
async function resolveJoinIdentity(user){let displayName=user.phone,memberType='member',power=0,id=user.phone;if(user.role==='yingxiao'){const heroes=await fetchHero();const mine=heroes.find(h=>String(h.phone)===String(user.phone));if(mine){displayName=heroDisplayName(mine)||user.phone;memberType='hero';power=Number(mine.power)||0;id=mine.id;}}else if(user.role==='ai'){const tools=await fetchDaShi();const mine=tools.find(d=>String(d.phone)===String(user.phone));if(mine){displayName=dashiDisplayName(mine)||user.phone;memberType='dashi';power=Number(mine.power)||0;id=mine.id;}}return{displayName,memberType,power,id};}
function memberMatchesUser(m,user,heroIds,dashiIds){if(!user||!m)return false;if(String(m.id)===String(user.phone))return true;if(m.phone&&String(m.phone)===String(user.phone))return true;if((m.type==='hero'||m.type==='yingxiao')&&heroIds&&heroIds.has(String(m.id)))return true;if((m.type==='dashi'||m.type==='si')&&dashiIds&&dashiIds.has(String(m.id)))return true;return false;}

async function pullIntoTeam(targetId,targetName,targetType,targetPower=0){const user=getUser();if(!user)return alert(t('tip.loginFirst'));if(user.role!=='jinzhu'&&user.role!=='admin')return alert(t('tip.noPermission'));const teams=await fetchTeam();let targetTeams=user.role==='admin'?teams:teams.filter(tm=>String(tm.phone)===String(user.phone));if(!targetTeams.length)return alert(t('tip.createTeamFirst'));let added=0,skipped=0;for(const team of targetTeams){let members=Array.isArray(team.members)?[...team.members]:[];if(isAlreadyInTeam(members,targetId)){skipped++;continue;}members.push({id:targetId,type:targetType||'member',name:targetName||String(targetId),power:Number(targetPower)||0});const{error}=await sb.from('team').update({members}).eq('id',team.id);if(!error)added++;}alert(added?`OK ${added}`:(skipped?t('tip.alreadyIn'):'Fail'));renderTeam();renderJinZhu();renderFocus();renderDaShi();renderHero();}
async function kickMember(teamId,memberId){const teams=await fetchTeam();const team=teams.find(tm=>tm.id===teamId);if(!team||!canEdit(team))return;await sb.from('team').update({members:(team.members||[]).filter(m=>String(m.id)!==String(memberId))}).eq('id',teamId);renderTeam();renderJinZhu();renderFocus();}
async function joinTeam(teamId){const user=getUser();if(!user)return alert(t('tip.loginFirst'));const ident=await resolveJoinIdentity(user);const teams=await fetchTeam();const team=teams.find(tm=>tm.id===teamId);if(!team)return;let members=Array.isArray(team.members)?[...team.members]:[];if(isAlreadyInTeam(members,ident.id))return alert(t('tip.alreadyIn'));members.push({id:ident.id,type:ident.memberType,name:ident.displayName,power:ident.power});await sb.from('team').update({members}).eq('id',teamId);renderTeam();renderFocus();}

function generateTeamName(phone){return 'Team-'+(phone||'').slice(-4)+'-'+Date.now().toString().slice(-4);}
function teamPowerSum(team){return(team.members||[]).reduce((s,m)=>s+(Number(m.power)||0),0);}
function rankByMatchThenPower(list,demandText,textFn,powerFn,limit){return list.map(item=>{const blob=textFn(item);const score=textMatch(demandText,blob);const power=powerFn(item);return{item,score,power};}).sort((a,b)=>{if(b.score!==a.score)return b.score-a.score;return b.power-a.power;}).slice(0,limit).map(x=>x.item);}
async function runFullBundle(jinzhuId,mode){const user=getUser();if(!user)return alert(t('tip.loginFirst'));if(user.role!=='jinzhu'&&user.role!=='admin')return alert(t('tip.noPermission'));const isSuper=mode==='super';const cfg=isSuper?BUNDLE_SUPER:BUNDLE_NORMAL;const jinzhuList=await fetchJinZhu();const jin=jinzhuList.find(j=>j.id===jinzhuId);if(!jin)return;if(!canEdit(jin)&&!isAdmin())return alert(t('tip.noPermission'));const teams=await fetchTeam();let team=teams.find(tm=>String(tm.jinzhu_id)===String(jinzhuId));if(!team){const newId=Date.now();const row={id:newId,name:generateTeamName(jin.phone||user.phone),phone:jin.phone||user.phone,members:[],jinzhu_id:jinzhuId,demand:jinzhuDisplayTitle(jin)||jinzhuDisplayName(jin)||'',progress_text:'',bundled_cases:[],bundled_surveys:[]};const{error}=await sb.from('team').insert(row);if(error)return alert(error.message||t('tip.bundleNoTeam'));team=row;}const demandText=accumulatePains(jin)+' '+(team.demand||'');const[heroes,dashis,cases,surveys]=await Promise.all([fetchHero(),fetchDaShi(),fetchSiCases(),fetchQgen()]);const topHeroes=rankByMatchThenPower(heroes,demandText,accumulateHero,h=>Number(h.power)||0,cfg.hero);const topSi=rankByMatchThenPower(dashis,demandText,accumulateTools,d=>Number(d.power)||0,cfg.si);const topCases=rankByMatchThenPower(cases,demandText,accumulateCase,()=>0,cfg.case);const pubSurveys=surveys.filter(s=>s.status==='published'||!s.status||s.status==='draft');const topSurveys=rankByMatchThenPower(pubSurveys.length?pubSurveys:surveys,demandText,s=>qgenDisplayName(s)+' '+qgenDisplayDesc(s)+' '+qgenDisplayIndustry(s),()=>0,cfg.survey);let members=Array.isArray(team.members)?[...team.members]:[];const addMember=(id,type,name,power)=>{if(isAlreadyInTeam(members,id))return;members.push({id,type,name:name||String(id),power:Number(power)||0});};topHeroes.forEach(h=>addMember(h.id,'hero',heroDisplayName(h),h.power));topSi.forEach(d=>addMember(d.id,'dashi',dashiDisplayName(d),d.power));const bundled_cases=topCases.map(c=>({id:c.id,title:caseDisplayTitle(c)}));const bundled_surveys=topSurveys.map(s=>({id:s.id,name:qgenDisplayName(s)}));const{error}=await sb.from('team').update({members,bundled_cases,bundled_surveys,demand:team.demand||jinzhuDisplayTitle(jin)||''}).eq('id',team.id);if(error)return alert(error.message);alert(isSuper?t('tip.superBundleOk'):t('tip.bundleOk'));renderJinZhu();renderTeam();renderFocus();}

function teamBundleHtml(team,isOwner){
  if(!team)return '';
  const cases=Array.isArray(team.bundled_cases)?team.bundled_cases:[];
  const surveys=Array.isArray(team.bundled_surveys)?team.bundled_surveys:[];
  if(!cases.length&&!surveys.length)return '';
  const showCase=!!teamCaseKickVisible[team.id],showSurvey=!!teamSurveyKickVisible[team.id];
  return`<div class="bundle-box ${showCase?'team-show-case':''} ${showSurvey?'team-show-survey':''}">
    ${cases.length?`<h5>${t('label.bundledCases')}</h5><div class="bundle-row">${cases.map(c=>`<span class="bundle-chip"><span class="tag tag-tool" onclick="switchView('sicase')">${escapeHtml(c.title||c.id||'')}</span>${isOwner?`<button type="button" class="bundle-x case-x" onclick="removeBundledCase(${team.id},${c.id})">×</button>`:''}</span>`).join('')}</div>`:''}
    ${surveys.length?`<h5 style="margin-top:8px">${t('label.bundledSurveys')}</h5><div class="bundle-row">${surveys.map(s=>`<span class="bundle-chip"><span class="tag tag-sub" onclick="switchView('qgen')">${escapeHtml(s.name||s.id||'')}</span>${isOwner?`<button type="button" class="bundle-x survey-x" onclick="removeBundledSurvey(${team.id},${s.id})">×</button>`:''}</span>`).join('')}</div>`:''}
  </div>`;
}

function teamBlockHtml(team,j,user,heroIds,dashiIds){
  if(!team)return '';
  const members=team.members||[];
  const isOwner=user&&(String(team.phone)===String(user.phone)||isAdmin());
  const isMember=user&&members.some(m=>memberMatchesUser(m,user,heroIds||new Set(),dashiIds||new Set()));
  const sum=teamPowerSum(team);
  const showKick=!!teamKickVisible[team.id],showCard=!!teamCardVisible[team.id];
  const showCase=!!teamCaseKickVisible[team.id],showSurvey=!!teamSurveyKickVisible[team.id];
  const canJoin=user&&!isMember&&!isOwner;
  const tipKick=showKick?t('team.tipKickOn'):t('team.tipKickOff');
  const tipCard=showCard?t('team.tipCardOn'):t('team.tipCardOff');
  const tipCase=showCase?t('team.tipCaseOn'):t('team.tipCaseOff');
  const tipSurvey=showSurvey?t('team.tipSurveyOn'):t('team.tipSurveyOff');
  return`<div class="team-box ${showKick?'team-show-kick':''} ${showCase?'team-show-case':''} ${showSurvey?'team-show-survey':''}">
    <div class="team-title">
      <h4 style="margin:0">👥 ${escapeHtml(team.name||'')}</h4>
      <span class="tag tag-power">⚡${sum}</span>
      ${user?`<button type="button" class="btn-icon-sm" title="${escapeAttr(t('btn.setFocus'))}" onclick="setPriorityTeam(${team.id})">🎯</button>`:''}
      ${isOwner?`<button type="button" class="btn-icon-sm ${showKick?'active-reorg':''}" title="${escapeAttr(tipKick)}" onclick="toggleTeamKick(${team.id})">${showKick?'✅':'🔀'}</button>`:''}
      <button type="button" class="btn-icon-sm ${showCard?'active-reorg':''}" title="${escapeAttr(tipCard)}" onclick="toggleTeamCard(${team.id})">${showCard?'🪪':'📇'}</button>
      ${isOwner?`<button type="button" class="btn-icon-sm ${showCase?'active-reorg':''}" title="${escapeAttr(tipCase)}" onclick="toggleTeamCaseKick(${team.id})">✨</button>`:''}
      ${isOwner?`<button type="button" class="btn-icon-sm ${showSurvey?'active-reorg':''}" title="${escapeAttr(tipSurvey)}" onclick="toggleTeamSurveyKick(${team.id})">📋</button>`:''}
      ${canJoin?`<button type="button" class="btn btn-team btn-sm" onclick="joinTeam(${team.id})">${t('btn.join')}</button>`:''}
      ${isOwner?`<button class="btn btn-del btn-sm" onclick="disbandTeam(${team.id})">${t('btn.disband')}</button>`:''}
    </div>
    ${team.demand?`<div class="card-desc" style="margin-top:6px"><b>${t('label.demand')}：</b>${escapeHtml(team.demand)}</div>`:''}
    <div class="member-list" style="margin-top:8px">${members.length?members.map(m=>memberChipHtml(m,isOwner,team.id)).join(''):'—'}</div>
    ${teamBundleHtml(team,isOwner)}
    ${teamProgressHtml(team,isOwner)}
    ${showCard&&j?renderBizCard(j.card,j.phone):''}
