<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>梦想显化器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;background:#f3f4f6;color:#1f2937;line-height:1.5;min-height:100vh}
a{color:#2563eb}
button,input,select,textarea{font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:6px 12px;border-radius:8px;border:1px solid transparent;cursor:pointer;font-size:13px;font-weight:500;transition:.15s}
.btn-sm{padding:4px 8px;font-size:12px}
.btn-primary{background:#2563eb;color:#fff}
.btn-primary:hover{background:#1d4ed8}
.btn-outline{background:#fff;border-color:#d1d5db;color:#374151}
.btn-outline:hover{background:#f9fafb}
.btn-edit{background:#0ea5e9;color:#fff}
.btn-del,.btn-danger{background:#dc2626;color:#fff}
.btn-survey{background:#0f766e;color:#fff;border:none}
.btn-icon-sm{width:28px;height:28px;padding:0;border-radius:8px;border:1px solid #e5e7eb;background:#fff;color:#374151;cursor:pointer;font-size:14px;line-height:1}
.btn-icon-sm:hover{border-color:#fbbf24;background:#fffbeb}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:#0f172a;border-right:1px solid #1e293b;padding:16px 12px;position:fixed;top:0;left:0;bottom:0;z-index:50;overflow-y:auto;transition:transform .2s}
.sidebar .brand{font-size:16px;font-weight:700;color:#fbbf24;padding:8px 10px 16px}
.menu-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;color:#94a3b8;cursor:pointer;font-size:13px;margin-bottom:2px}
.menu-item:hover{background:#1e293b;color:#e2e8f0}
.menu-item.active{background:#1e3a5f;color:#fbbf24}
.menu-item.admin-only{display:none}
.main{flex:1;margin-left:220px;min-height:100vh;display:flex;flex-direction:column;background:#f3f4f6}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:40}
.topbar-left{display:flex;align-items:center;gap:8px}
#btnMenu{display:none;background:#fff;border:1px solid #e5e7eb;color:#374151;padding:6px 10px;border-radius:8px;cursor:pointer}
.role-badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
.role-jinzhu{background:#ffedd5;color:#c2410c}
.role-ai{background:#dbeafe;color:#1d4ed8}
.role-admin{background:#ede9fe;color:#6d28d9}
.role-kefu{background:#ccfbf1;color:#0f766e}
.role-shenhe{background:#f3f4f6;color:#4b5563}
.role-yingxiao{background:#fce7f3;color:#be185d}
.quick-badges{display:none;gap:6px;margin-right:8px}
.quick-badges span{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#78350f;background:#fbbf24;cursor:pointer}
.content{padding:16px;flex:1}
.view{display:none}
.view.active{display:block}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.section-title{font-size:18px;font-weight:700;color:#111827}
.search-bar{margin-bottom:12px}
.search-bar input{width:100%;max-width:480px;padding:10px 14px;border-radius:24px;border:1px solid #e5e7eb;background:#fff;color:#111827;outline:none}
.search-bar input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.pager{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 20px;font-size:13px}
.pager a,.pager span{display:inline-flex;min-width:32px;height:32px;align-items:center;justify-content:center;padding:0 8px;border-radius:6px;text-decoration:none}
.pager a{color:#2563eb;border:1px solid #e5e7eb;background:#fff}
.pager .cur{background:#2563eb;color:#fff;border:1px solid #2563eb}
.pager .disabled{color:#9ca3af;border:1px solid #f3f4f6}
.card{display:flex;gap:12px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card.focus-card,.card.priority-card{border-color:#fbbf24}
.avatar{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.avatar-jinzhu{background:#ffedd5;color:#c2410c}
.avatar-dashi{background:#dbeafe;color:#1d4ed8}
.avatar-hero{background:#fce7f3;color:#be185d}
.avatar-team{background:#ccfbf1;color:#0f766e}
.avatar-diag{background:#ede9fe;color:#6d28d9}
.card-content{flex:1;min-width:0}
.card-title{font-weight:600;font-size:15px;margin-bottom:6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:#111827}
.card-desc{font-size:13px;color:#6b7280;margin-bottom:4px;word-break:break-word}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;background:#f3f4f6;color:#374151}
.tag-power{background:#fef3c7;color:#b45309}
.tag-diff{background:#dbeafe;color:#1d4ed8}
.tag-reward{background:#fae8ff;color:#a21caf}
.tag-industry{background:#dcfce7;color:#047857}
.empty-tip{text-align:center;color:#9ca3af;padding:32px 16px;font-size:14px}
.x-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.x-icon{width:32px;height:32px;border-radius:8px;border:1px solid #e5e7eb;background:#fff;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.x-icon:hover{border-color:#fbbf24;background:#fffbeb}
.x-icon.pull{background:#ecfdf5;border-color:#6ee7b7}
.team-box{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-top:10px}
.member-header{font-size:12px;color:#6b7280;margin:8px 0 6px}
.member-list{display:flex;flex-wrap:wrap;gap:8px}
.member-chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:4px 10px 4px 4px;font-size:12px}
.member-chip img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#f3f4f6}
.member-chip .power-icon{color:#b45309;font-size:11px}
.member-x,.team-x{opacity:0;pointer-events:none;width:22px;height:22px;border:none;border-radius:50%;background:#dc2626;color:#fff;cursor:pointer;font-size:14px;line-height:1;margin-left:2px;transition:opacity .15s}
.team-title:hover .team-x,.member-chip:hover .member-x,.team-show-kick .member-x{opacity:1;pointer-events:auto}
.team-progress-box{margin-top:10px;padding:10px 12px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px}
.team-progress-box h5{font-size:13px;color:#b45309;margin-bottom:6px}
.prog-item{font-size:12px;color:#4b5563;margin:3px 0}
.modal-mask{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
.modal{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;width:100%;max-width:440px;color:#1f2937;box-shadow:0 20px 50px rgba(0,0,0,.12)}
.modal.wide{max-width:640px}
.modal h3{margin-bottom:14px;font-size:17px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;color:#6b7280;margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #d1d5db;background:#fff;color:#111827}
.form-group textarea{min-height:72px;resize:vertical}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:45}
.sidebar-overlay.open{display:block}
#chatMessages{max-height:280px;overflow-y:auto;background:#f9fafb;border-radius:10px;padding:12px;margin-bottom:10px;border:1px solid #e5e7eb}
.msg.user{text-align:right;margin:6px 0;color:#1d4ed8}
.msg.bot{text-align:left;margin:6px 0;color:#0f766e}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left}
th{color:#6b7280;font-weight:500}

.home-hero{
  position:relative;max-width:420px;margin:0 auto 20px;border-radius:18px;overflow:hidden;
  box-shadow:0 8px 32px rgba(15,23,42,.12);
  background:#0b1220 center top/cover no-repeat;
  background-image:url('poster-vertical.jpg');
  min-height:520px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  padding:0 12px 18px;
}
.home-hero::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,transparent 0%,transparent 55%,rgba(8,12,28,.3) 70%,rgba(8,12,28,.55) 100%);
}
.home-step-icons{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.home-step-icon{
  width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid rgba(251,191,36,.65);
  background:radial-gradient(circle at 30% 30%,#fde68a,#b45309);
  color:#1c1917;font-size:18px;text-decoration:none;cursor:pointer;
  box-shadow:0 2px 12px rgba(0,0,0,.25);transition:transform .15s,box-shadow .15s;
}
.home-step-icon:hover{transform:translateY(-2px) scale(1.06);box-shadow:0 6px 18px rgba(251,191,36,.4)}
.home-sections{margin-top:8px}

.kybalion-page{
  min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px 20px;gap:28px;
}
.kyb-line{letter-spacing:.12em}
.kyb-title{font-size:28px;font-weight:700;color:#b45309}
.kyb-link a{font-size:22px;color:#2563eb;text-decoration:none;border-bottom:1px solid rgba(37,99,235,.35)}
.kyb-link a:hover{border-bottom-color:#2563eb}
.kyb-sub{font-size:18px;color:#6b7280}

@media(min-width:768px){
  .home-hero{max-width:480px;min-height:600px}
  .home-step-icon{width:48px;height:48px;font-size:20px}
  .quick-badges{display:inline-flex}
  .kyb-title{font-size:36px}
  .kyb-link a{font-size:28px}
  .kyb-sub{font-size:22px}
}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  #btnMenu{display:inline-block}
  .quick-badges{display:none!important}
}
</style>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="brand">✦ 梦想显化器</div>
    <div class="menu-item active" data-view="home">🏠 首页</div>
    <div class="menu-item" data-view="kybalion">📖 宇宙法则指引</div>
    <div class="menu-item" data-view="focus">🎯 当前显化中心</div>
    <div class="menu-item" data-view="team">👥 我的超级团队</div>
    <div class="menu-item" data-view="jinzhu">💼 金主需求中心</div>
    <div class="menu-item" data-view="dashi">🤖 超级智能中心</div>
    <div class="menu-item" data-view="hero">⭐ 超级精英中心</div>
    <div class="menu-item" data-view="qgen">📋 问卷生成中心</div>
    <div class="menu-item" data-view="diagnosis">🩺 需求诊断中心</div>
    <div class="menu-item" data-view="inbox">📬 站内信</div>
    <div class="menu-item" data-view="coop">🤝 商务合作</div>
    <div class="menu-item" data-view="chat">💬 在线客服</div>
    <div class="menu-item admin-only" data-view="users">👤 用户管理</div>
    <div class="menu-item admin-only" data-view="coop-list">📑 商务合作汇总</div>
    <div class="menu-item admin-only" data-view="chat-list">🗂 在线客服汇总</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button type="button" id="btnMenu" onclick="toggleSidebar(true)">☰</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="quick-badges">
          <span title="金主" onclick="switchView('jinzhu')">金主</span>
          <span title="SI" onclick="switchView('dashi')">SI</span>
          <span title="精英" onclick="switchView('hero')">精英</span>
          <span title="团队" onclick="switchView('team')">团队</span>
          <span title="诊" onclick="switchView('diagnosis')">诊</span>
        </div>
        <div id="userArea"></div>
      </div>
    </div>
    <div class="content">
      <div id="view-home" class="view active">
        <div class="home-hero">
          <div class="home-step-icons">
            <a href="javascript:void(0)" class="home-step-icon" title="宇宙法则指引方向" onclick="switchView('focus')">✦</a>
            <a href="javascript:void(0)" class="home-step-icon" title="超级智能" onclick="switchView('dashi')">⚙</a>
            <a href="javascript:void(0)" class="home-step-icon" title="诊断问卷" onclick="switchView('diagnosis')">📡</a>
            <a href="javascript:void(0)" class="home-step-icon" title="超级精英团队" onclick="switchView('team')">👥</a>
            <a href="javascript:void(0)" class="home-step-icon" title="金主需求" onclick="switchView('jinzhu')">♥</a>
          </div>
        </div>
        <div class="home-sections">
          <div class="section-head"><span class="section-title">金主需求</span></div>
          <div class="search-bar"><input id="home-jz-q" placeholder="搜索金主需求…" oninput="homeJzPage=1;renderHome()"></div>
          <div id="home-jinzhu-list"></div>
          <div id="home-jz-pager" class="pager"></div>
          <div class="section-head" style="margin-top:20px"><span class="section-title">超级智能</span></div>
          <div class="search-bar"><input id="home-ds-q" placeholder="搜索超级智能…" oninput="homeDsPage=1;renderHome()"></div>
          <div id="home-dashi-list"></div>
          <div id="home-ds-pager" class="pager"></div>
        </div>
      </div>

      <div id="view-kybalion" class="view">
        <div class="kybalion-page">
          <div class="kyb-line kyb-title">宇宙法则</div>
          <div class="kyb-line kyb-link"><a href="https://www.kybalion.com" target="_blank" rel="noopener">www.kybalion.com</a></div>
          <div class="kyb-line kyb-sub">有缘者联系管理员</div>
        </div>
      </div>

      <div id="view-focus" class="view">
        <div class="section-head">
          <span class="section-title">🎯 当前显化中心</span>
          <button type="button" class="btn btn-outline btn-sm" onclick="switchView('team')">查看全部团队</button>
        </div>
        <div id="focus-list"></div>
      </div>
      <div id="view-team" class="view">
        <div class="section-head">
          <span class="section-title">我的超级团队</span>
          <button type="button" class="btn btn-primary btn-sm" id="btn-add-team" style="display:none" onclick="openAddTeam()">+ 创建团队</button>
        </div>
        <div class="search-bar"><input id="team-q" placeholder="搜索团队…" oninput="teamPage=1;renderTeam()"></div>
        <div id="team-list"></div>
        <div id="team-pager" class="pager"></div>
      </div>
      <div id="view-jinzhu" class="view">
        <div class="section-head">
          <span class="section-title">金主需求中心</span>
          <button type="button" class="btn btn-primary btn-sm" id="btn-add-jinzhu" style="display:none" onclick="openAddJinZhu()">+ 发布需求</button>
        </div>
        <div class="search-bar"><input id="jz-q" placeholder="搜索金主需求…" oninput="jzPage=1;renderJinZhu()"></div>
        <div id="jinzhu-list"></div>
        <div id="jz-pager" class="pager"></div>
      </div>
      <div id="view-dashi" class="view">
        <div class="section-head">
          <span class="section-title">超级智能中心</span>
          <button type="button" class="btn btn-primary btn-sm" id="btn-add-dashi" style="display:none" onclick="openAddDaShi()">+ 发布工具</button>
        </div>
        <div class="search-bar"><input id="ds-q" placeholder="搜索超级智能…" oninput="dsPage=1;renderDaShi()"></div>
        <div id="dashi-list"></div>
        <div id="ds-pager" class="pager"></div>
      </div>
      <div id="view-hero" class="view">
        <div class="section-head">
          <span class="section-title">超级精英中心</span>
          <button type="button" class="btn btn-primary btn-sm" id="btn-add-hero" style="display:none" onclick="openAddHero()">+ 发布精英</button>
        </div>
        <div class="search-bar"><input id="hero-q" placeholder="搜索超级精英…" oninput="heroPage=1;renderHero()"></div>
        <div id="hero-list"></div>
        <div id="hero-pager" class="pager"></div>
      </div>
      <div id="view-qgen" class="view">
        <div class="section-head">
          <span class="section-title">问卷生成中心</span>
          <button type="button" class="btn btn-primary btn-sm" id="btn-add-qgen" style="display:none" onclick="openAddQgen()">+ 新建问卷</button>
        </div>
        <div id="qgen-team-tip" style="display:none;margin-bottom:10px;font-size:13px;color:#6b7280"></div>
        <div class="search-bar"><input id="qgen-q" placeholder="搜索问卷…" oninput="qgenPage=1;renderQgen()"></div>
        <div id="qgen-list"></div>
        <div id="qgen-pager" class="pager"></div>
      </div>
      <div id="view-diagnosis" class="view">
        <div class="section-head"><span class="section-title">需求诊断中心</span></div>
        <div class="search-bar"><input id="diag-q" placeholder="搜索诊断…" oninput="diagPage=1;renderDiagnosis()"></div>
        <div id="diagnosis-list"></div>
        <div id="diag-pager" class="pager"></div>
      </div>
      <div id="view-inbox" class="view">
        <div class="section-head"><span class="section-title">站内信</span></div>
        <div id="inbox-list"></div>
      </div>
      <div id="view-coop" class="view">
        <div class="section-head"><span class="section-title">商务合作</span></div>
        <div class="card"><div class="card-content">
          <div class="form-group"><label>名称 *</label><input id="coop-name"></div>
          <div class="form-group"><label>联系方式 *</label><input id="coop-contact"></div>
          <div class="form-group"><label>类型</label>
            <select id="coop-type"><option>商务合作</option><option>广告投放</option><option>其它</option></select>
          </div>
          <div class="form-group"><label>说明</label><textarea id="coop-desc"></textarea></div>
          <button type="button" class="btn btn-primary" onclick="submitCoop()">提交</button>
        </div></div>
      </div>
      <div id="view-chat" class="view">
        <div class="section-head"><span class="section-title">在线客服</span></div>
        <div id="chatMessages"></div>
        <div style="display:flex;gap:8px">
          <input id="chatInput" placeholder="输入消息…" style="flex:1;padding:8px 12px;border-radius:8px;border:1px solid #d1d5db;background:#fff" onkeydown="if(event.key==='Enter')sendChat()">
          <button type="button" class="btn btn-primary" onclick="sendChat()">发送</button>
        </div>
      </div>
      <div id="view-users" class="view">
        <div class="section-head"><span class="section-title">用户管理</span></div>
        <div style="overflow-x:auto">
          <table><thead><tr><th>手机号</th><th>角色</th><th>注册时间</th><th>状态</th></tr></thead>
          <tbody id="users-tbody"></tbody></table>
        </div>
      </div>
      <div id="view-coop-list" class="view">
        <div class="section-head"><span class="section-title">商务合作汇总</span></div>
        <div id="coop-list"></div>
      </div>
      <div id="view-chat-list" class="view">
        <div class="section-head"><span class="section-title">在线客服汇总</span></div>
        <div id="chat-list"></div>
      </div>
    </div>
  </div>
</div>

<script>

const SUPABASE_ANON = 'sb_publishable_kFl81SUb0hBxII2Eykb74A_KkDr1n3U';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const PAGE_SIZE = 8;
const DEFAULT_AVATAR = 'https://api.dicebear.com/7.x/bottts/svg?seed=';
const ROLE_MAP = {jinzhu:'金主企业',ai:'AI公司',admin:'管理员',kefu:'客服',shenhe:'审核',yingxiao:'行业精英'};
const ROLE_CLS = {jinzhu:'role-jinzhu',ai:'role-ai',admin:'role-admin',kefu:'role-kefu',shenhe:'role-shenhe',yingxiao:'role-yingxiao'};

let currentUser = null;
let homeJzPage=1, homeDsPage=1, jzPage=1, dsPage=1, heroPage=1, teamPage=1, qgenPage=1, diagPage=1;
let teamKickVisible = {};
let cache = {jinzhu:[], dashi:[], hero:[], team:[], qgen:[], diagnosis:[]};

function $(id){ return document.getElementById(id); }
function escapeHtml(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escapeAttr(s){ return escapeHtml(s).replace(/'/g,'&#39;'); }
function linkify(t){ if(!t) return ''; const s=escapeHtml(t); return s.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>'); }
function getUser(){ try{ return currentUser || JSON.parse(localStorage.getItem('dreamsi_user')||'null'); }catch(e){ return null; } }
function setUser(u){ currentUser=u; if(u) localStorage.setItem('dreamsi_user', JSON.stringify(u)); else localStorage.removeItem('dreamsi_user'); }
function isAdmin(u){ return u && (u.role==='admin' || u.phone==='admin'); }
function num(v,d){ const n=Number(v); return isFinite(n)?n:(d||0); }
function nowId(){ return Date.now(); }

function toggleSidebar(open){
  const el=$('sidebar'), ov=$('sidebarOverlay');
  if(open){ el.classList.add('open'); ov.classList.add('open'); }
  else { el.classList.remove('open'); ov.classList.remove('open'); }
}

function switchView(name){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const el = $('view-' + name);
  if(el) el.classList.add('active');
  document.querySelectorAll('.menu-item').forEach(m => {
    m.classList.toggle('active', m.getAttribute('data-view') === name);
  });
  toggleSidebar(false);
  const map = {
    home: renderHome, focus: renderFocus, team: renderTeam, jinzhu: renderJinZhu,
    dashi: renderDaShi, hero: renderHero, qgen: renderQgen, diagnosis: renderDiagnosis,
    inbox: renderInbox, users: renderUsers, 'coop-list': renderCoopList, 'chat-list': renderChatList,
    kybalion: null, coop: null, chat: null
  };
  if(map[name]) map[name]();
}

document.querySelectorAll('.menu-item').forEach(m => {
  m.addEventListener('click', () => {
    const v = m.getAttribute('data-view');
    if(v) switchView(v);
  });
});

function renderUserArea(){
  const box = $('userArea'); if(!box) return;
  const u = getUser();
  if(!u){
    box.innerHTML = `<button type="button" class="btn btn-primary btn-sm" onclick="openModal('login')">登录</button>
      <button type="button" class="btn btn-outline btn-sm" onclick="openModal('register')">注册</button>`;
    document.querySelectorAll('.menu-item.admin-only').forEach(el => el.style.display = 'none');
    return;
  }
  const roleName = ROLE_MAP[u.role] || u.role || '用户';
  const cls = ROLE_CLS[u.role] || 'role-shenhe';
  box.innerHTML = `<span class="role-badge ${cls}">${escapeHtml(roleName)}</span>
    <span>${escapeHtml(u.phone||'')}</span>
    <button type="button" class="btn btn-outline btn-sm" onclick="logout()">退出</button>`;
  document.querySelectorAll('.menu-item.admin-only').forEach(el => {
    el.style.display = isAdmin(u) ? 'flex' : 'none';
  });
  if($('btn-add-jinzhu')) $('btn-add-jinzhu').style.display = (u.role==='jinzhu'||isAdmin(u)) ? 'inline-flex' : 'none';
  if($('btn-add-dashi')) $('btn-add-dashi').style.display = (u.role==='ai'||isAdmin(u)) ? 'inline-flex' : 'none';
  if($('btn-add-hero')) $('btn-add-hero').style.display = (u.role==='yingxiao'||isAdmin(u)) ? 'inline-flex' : 'none';
  if($('btn-add-team')) $('btn-add-team').style.display = (u.role==='jinzhu'||isAdmin(u)) ? 'inline-flex' : 'none';
  if($('btn-add-qgen')) $('btn-add-qgen').style.display = 'inline-flex';
}

function logout(){ setUser(null); renderUserArea(); switchView('home'); renderHome(); }

function openModal(type, data){
  const mask=$('modalMask'), box=$('modalBox');
  mask.style.display = 'flex';
  if(type==='login'){
    box.className='modal';
    box.innerHTML = `<h3>登录</h3>
      <div class="form-group"><label>手机号</label><input id="m-phone"></div>
      <div class="form-group"><label>密码</label><input id="m-pass" type="password"></div>
      <div class="form-actions">
        <button type="button" class="btn btn-outline" onclick="closeModal()">取消</button>
        <button type="button" class="btn btn-primary" onclick="doLogin()">登录</button>
      </div>`;
  } else if(type==='register'){
    box.className='modal';
    box.innerHTML = `<h3>注册</h3>
      <div class="form-group"><label>手机号</label><input id="m-phone"></div>
      <div class="form-group"><label>密码</label><input id="m-pass" type="password"></div>
      <div class="form-group"><label>角色</label>
        <select id="m-role">
          <option value="jinzhu">金主企业</option>
          <option value="ai">AI公司</option>
          <option value="yingxiao">行业精英</option>
        </select>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-outline" onclick="closeModal()">取消</button>
        <button type="button" class="btn btn-primary" onclick="doRegister()">注册</button>
      </div>`;
  } else if(type==='html'){
    box.className = 'modal wide';
    box.innerHTML = data || '';
  }
}
function closeModal(){ $('modalMask').style.display='none'; $('modalBox').innerHTML=''; }

/* 139 登录后进入超级智能中心 */
async function doLogin(){
  const phone = ($('m-phone').value||'').trim();
  const pass = ($('m-pass').value||'').trim();
  if(!phone||!pass){ alert('请填写手机号和密码'); return; }
  try{
    const {data, error} = await sb.from('app_users').select('*').eq('phone',phone).eq('password',pass).maybeSingle();
    if(error) throw error;
    if(!data){ alert('账号或密码错误'); return; }
    setUser(data); closeModal(); renderUserArea();
    switchView('dashi');
  }catch(e){ console.error(e); alert('登录失败: '+(e.message||e)); }
}

async function doRegister(){
  const phone = ($('m-phone').value||'').trim();
  const pass = ($('m-pass').value||'').trim();
  const role = ($('m-role').value||'jinzhu');
  if(!phone||!pass){ alert('请填写手机号和密码'); return; }
  try{
    const row = {id:nowId(), phone, password:pass, role, status:'ok', created_at:new Date().toISOString()};
    const {error} = await sb.from('app_users').insert(row);
    if(error) throw error;
    setUser(row); closeModal(); renderUserArea(); switchView('dashi');
  }catch(e){ console.error(e); alert('注册失败: '+(e.message||e)); }
}

function renderPager(elId, page, total){
  const el = $(elId); if(!el) return;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(pages <= 1){ el.innerHTML = ''; return; }
  let html = '';
  for(let i=1;i<=pages;i++){
    html += i===page ? `<span class="cur">${i}</span>` : `<a href="javascript:void(0)" data-p="${i}">${i}</a>`;
  }
  html += page<pages ? `<a class="next" href="javascript:void(0)" data-p="${page+1}">下一页</a>` : `<span class="disabled next">下一页</span>`;
  el.innerHTML = html;
}
function bindPager(id, fn){
  const el = $(id); if(!el) return;
  el.querySelectorAll('a[data-p]').forEach(a => {
    a.onclick = e => { e.preventDefault(); fn(Number(a.getAttribute('data-p'))); };
  });
}
function paginate(arr, page){
  const start = (page-1)*PAGE_SIZE;
  return arr.slice(start, start+PAGE_SIZE);
}
function filterByQ(arr, q, fields){
  q = (q||'').trim().toLowerCase();
  if(!q) return arr;
  return arr.filter(item => {
    const blob = fields.map(f => {
      const v = item[f];
      if(v==null) return '';
      if(typeof v==='object') return JSON.stringify(v);
      return String(v);
    }).join(' ').toLowerCase();
    return blob.includes(q);
  });
}

async function fetchAll(){
  try{
    const [jz,ds,hr,tm,qg,dg] = await Promise.all([
      sb.from('jinzhu').select('*').order('id',{ascending:false}),
      sb.from('dashi').select('*').order('id',{ascending:false}),
      sb.from('hero').select('*').order('id',{ascending:false}),
      sb.from('team').select('*').order('id',{ascending:false}),
      sb.from('questionnaire_templates').select('*').order('id',{ascending:false}),
      sb.from('diagnosis_surveys').select('*').order('id',{ascending:false})
    ]);
    cache.jinzhu = jz.data || [];
    cache.dashi = ds.data || [];
    cache.hero = hr.data || [];
    cache.team = tm.data || [];
    cache.qgen = qg.data || [];
    cache.diagnosis = dg.data || [];
  }catch(e){ console.warn('fetchAll', e); }
}

function parseMembers(t){
  if(Array.isArray(t.members)) return t.members.slice();
  if(typeof t.members === 'string'){
    try{ return JSON.parse(t.members)||[]; }catch(e){ return []; }
  }
  return [];
}
function parseProgress(t){
  if(Array.isArray(t.progress)) return t.progress;
  if(typeof t.progress === 'string'){
    try{ return JSON.parse(t.progress)||[]; }catch(e){ return t.progress ? [t.progress] : []; }
  }
  return [];
}

function priorityStorageKey(u){ return 'dreamsi_priority_'+(u&&u.phone||'guest'); }
function getLocalPriorityTeamId(u){ return Number(localStorage.getItem(priorityStorageKey(u))||0)||0; }
function setLocalPriorityTeamId(u, id){ localStorage.setItem(priorityStorageKey(u), String(id||0)); }
async function getPriorityTeamId(u){
  if(!u) return 0;
  if(u.priority_team_id) return Number(u.priority_team_id)||0;
  return getLocalPriorityTeamId(u);
}
async function setPriorityTeam(teamId){
  const u = getUser(); if(!u){ openModal('login'); return; }
  setLocalPriorityTeamId(u, teamId);
  try{
    await sb.from('app_users').update({priority_team_id: teamId}).eq('id', u.id);
    u.priority_team_id = teamId; setUser(u);
  }catch(e){ console.warn(e); }
  switchView('focus');
}

/* 142 去重 */
function isAlreadyInTeam(members, id){
  const sid = String(id);
  if(!(members && members.length)) return false;
  return members.some(m => String(m.id) === sid);
}

/* 140 身份解析 */
async function resolveJoinIdentity(user){
  if(!user) return null;
  if(user.role === 'yingxiao'){
    const h = (cache.hero||[]).find(x =>
      String(x.phone)===String(user.phone) || String(x.owner_phone)===String(user.phone)
    );
    if(h) return {id:h.id, name:h.name||h.title||user.phone, type:'hero', power:num(h.power,0), avatar:h.avatar||'', phone:user.phone};
    return {id:user.phone, name:user.phone, type:'hero', power:0, avatar:'', phone:user.phone};
  }
  if(user.role === 'ai'){
    const d = (cache.dashi||[]).find(x =>
      String(x.phone)===String(user.phone) || String(x.owner_phone)===String(user.phone)
    );
    if(d) return {id:d.id, name:d.name||d.title||user.phone, type:'dashi', power:num(d.power,0), avatar:d.avatar||'', phone:user.phone};
    return {id:user.phone, name:user.phone, type:'dashi', power:0, avatar:'', phone:user.phone};
  }
  return {id:user.phone, name:user.phone, type:'member', power:0, avatar:'', phone:user.phone};
}

function powerIcon(n){ return `<span class="tag tag-power">⚡${num(n,0)}</span>`; }
function diffIcon(n){ return `<span class="tag tag-diff">◆${num(n,0)}</span>`; }

/* 138 进展仅金主/管理员 */
function canSeeProgress(user, team){
  if(!user) return false;
  if(isAdmin(user)) return true;
  if(user.role==='jinzhu' && (
    String(team.owner_phone)===String(user.phone) ||
    String(team.jinzhu_phone)===String(user.phone)
  )) return true;
  return false;
}

function memberChipHtml(m, teamId, showKick){
  const name = escapeHtml(m.name||m.title||m.id||'成员');
  const type = m.type || 'member';
  const power = num(m.power,0);
  const seed = encodeURIComponent(String(m.id||name));
  const av = m.avatar || (DEFAULT_AVATAR + seed);
  const click = type==='dashi' ? `onclick="switchView('dashi')"` : (type==='hero' ? `onclick="switchView('hero')"` : '');
  const kick = showKick
    ? `<button type="button" class="member-x" title="移除" onclick="kickMember(${teamId},'${escapeAttr(String(m.id))}','${escapeAttr(type)}')">×</button>`
    : '';
  return `<span class="member-chip" ${click} style="cursor:pointer">
    <img src="${escapeAttr(av)}" alt="">
    <span>${name}${type==='dashi'?'(SI)':type==='hero'?'(精英)':''}</span>
    <span class="power-icon">⚡${power}</span>${kick}
  </span>`;
}

function renderProgressHtml(team){
  const list = parseProgress(team);
  const powerSum = num(team.power,0) || (parseMembers(team).reduce((s,m)=>s+num(m.power,0),0));
  let items = list.map(p => `<div class="prog-item">• ${escapeHtml(typeof p==='string'?p:(p.text||JSON.stringify(p)))}</div>`).join('');
  if(team.dream) items += `<div class="prog-item" style="margin-top:6px;color:#9ca3af">梦想：${escapeHtml(team.dream)}</div>`;
  return `<div class="team-progress-box"><h5>📝 团队进展与业绩　战力 ⚡${powerSum}</h5>${items||'<div class="prog-item">暂无进展</div>'}</div>`;
}

function renderOneTeamCard(t, linkedJin, user, opts){
  opts = opts || {};
  const members = parseMembers(t);
  const powerSum = members.reduce((s,m)=>s+num(m.power,0),0) || num(t.power,0);
  const diff = num(t.difficulty!=null ? t.difficulty : (linkedJin && linkedJin.difficulty), 0);
  const industry = escapeHtml(t.industry || (linkedJin && linkedJin.industry) || '');
  const demand = escapeHtml(t.demand || t.desc || (linkedJin && (linkedJin.detail||linkedJin.desc)) || '');
  const showKick = !!teamKickVisible[t.id];
  const isOwner = user && (String(t.owner_phone)===String(user.phone) || isAdmin(user));
  const canJoinBtn = user && user.role !== 'jinzhu';
  const seeProg = canSeeProgress(user, t);

  let actions = `
    <button type="button" class="btn btn-survey btn-sm" onclick="goQgenFromTeam(${t.id})">需求问卷</button>
    <button type="button" class="btn-icon-sm" title="设为最高优先级" onclick="setPriorityTeam(${t.id})">🎯</button>`;
  if(canJoinBtn) actions += `<button type="button" class="btn-icon-sm" title="加入团队" onclick="joinTeam(${t.id})" style="background:#d1fae5">➕</button>`;
  if(isOwner){
    actions += `<button type="button" class="btn btn-edit btn-sm" onclick="editTeam(${t.id})">编辑</button>`;
    actions += `<button type="button" class="team-x" title="解散整个团队" onclick="disbandTeam(${t.id})">×</button>`;
  }

  const memberHtml = members.length
    ? members.map(m => memberChipHtml(m, t.id, showKick && isOwner)).join('')
    : '<span style="color:#9ca3af;font-size:12px">暂无成员</span>';

  return `<div class="card ${opts.isFocus||opts.isPriority?'focus-card':''}">
    <div class="avatar avatar-team">团队</div>
    <div class="card-content">
      <div class="card-title">
        <span>${escapeHtml(t.name||('团队'+t.id))}</span>
        ${powerIcon(powerSum)}
        ${actions}
      </div>
      <div class="card-desc">行业 <span class="tag tag-industry">${industry||'—'}</span></div>
      <div class="card-desc">需求 ${diffIcon(diff)} ：${demand||'—'}</div>
      <div class="team-box">
        <div class="member-header">队员清单
          ${isOwner?`<button type="button" class="btn-icon-sm" title="${showKick?'结束重组':'开始重组'}" onclick="toggleKickVisible(${t.id})" style="margin-left:6px">${showKick?'✅':'🔀'}</button>`:''}
        </div>
        <div class="member-list ${showKick?'team-show-kick':''}">${memberHtml}</div>
      </div>
      ${seeProg ? renderProgressHtml(Object.assign({}, t, {power:powerSum})) : ''}
    </div>
  </div>`;
}

function toggleKickVisible(teamId){
  teamKickVisible[teamId] = !teamKickVisible[teamId];
  renderTeam(); renderFocus();
}

async function joinTeam(teamId){
  const user = getUser(); if(!user){ openModal('login'); return; }
  const ident = await resolveJoinIdentity(user);
  const t = (cache.team||[]).find(x => Number(x.id)===Number(teamId));
  if(!t){ alert('团队不存在'); return; }
  let members = parseMembers(t);
  if(isAlreadyInTeam(members, ident.id)){ alert('已在团队中'); return; }
  members.push({id:ident.id, name:ident.name, type:ident.type, power:ident.power, avatar:ident.avatar, phone:ident.phone});
  try{
    const {error} = await sb.from('team').update({members}).eq('id', teamId);
    if(error) throw error;
    await fetchAll(); renderTeam(); renderFocus(); alert('已加入团队');
  }catch(e){ alert('加入失败: '+(e.message||e)); }
}

async function pullIntoTeam(targetId, targetName, targetType, power, avatar){
  const user = getUser(); if(!user){ openModal('login'); return; }
  if(user.role!=='jinzhu' && !isAdmin(user)){ alert('仅金主或管理员可拉入'); return; }
  const teams = (cache.team||[]).filter(t => isAdmin(user) || String(t.owner_phone)===String(user.phone));
  if(!teams.length){ alert('请先创建团队'); return; }
  let team = teams[0];
  if(teams.length > 1){
    const names = teams.map((t,i)=>`${i+1}. ${t.name}`).join('\n');
    const pick = prompt('选择团队序号:\n'+names, '1');
    const idx = Number(pick)-1;
    if(idx<0 || idx>=teams.length) return;
    team = teams[idx];
  }
  let members = parseMembers(team);
  if(isAlreadyInTeam(members, targetId)){ alert('该成员已在团队中'); return; }
  members.push({id:targetId, name:targetName, type:targetType||'member', power:num(power,0), avatar:avatar||''});
  try{
    const {error} = await sb.from('team').update({members}).eq('id', team.id);
    if(error) throw error;
    await fetchAll(); alert('已拉入团队'); renderTeam();
  }catch(e){ alert('拉入失败: '+(e.message||e)); }
}

async function kickMember(teamId, memberId, type){
  const t = (cache.team||[]).find(x => Number(x.id)===Number(teamId));
  if(!t) return;
  let members = parseMembers(t).filter(m => !(String(m.id)===String(memberId)));
  try{
    await sb.from('team').update({members}).eq('id', teamId);
    await fetchAll(); renderTeam(); renderFocus();
  }catch(e){ alert('移除失败'); }
}

async function disbandTeam(teamId){
  if(!confirm('确定解散整个团队？')) return;
  try{
    await sb.from('team').delete().eq('id', teamId);
    await fetchAll(); renderTeam(); renderFocus();
  }catch(e){ alert('解散失败'); }
}

function goQgenFromTeam(teamId){
  window._qgenTeamId = teamId;
  switchView('qgen');
  const tip = $('qgen-team-tip');
  if(tip){ tip.style.display='block'; tip.textContent = '当前关联团队 ID: '+teamId; }
}

async function pickTeamAndJoin(){
  const teams = cache.team || [];
  if(!teams.length){ alert('暂无团队可加入'); return; }
  if(teams.length===1){ await joinTeam(teams[0].id); return; }
  const names = teams.map((t,i)=>`${i+1}. ${t.name}`).join('\n');
  const pick = prompt('选择要加入的团队序号:\n'+names, '1');
  const idx = Number(pick)-1;
  if(idx<0 || idx>=teams.length) return;
  await joinTeam(teams[idx].id);
}

async function renderHome(){
  await fetchAll();
  const jzQ = ($('home-jz-q')&&$('home-jz-q').value)||'';
  const dsQ = ($('home-ds-q')&&$('home-ds-q').value)||'';
  let jz = filterByQ(cache.jinzhu, jzQ, ['name','title','desc','detail','industry','website','phone']);
  let ds = filterByQ(cache.dashi, dsQ, ['name','title','desc','category','website']);
  const jzBox = $('home-jinzhu-list'), dsBox = $('home-dashi-list');
  if(jzBox) jzBox.innerHTML = paginate(jz,homeJzPage).length
    ? paginate(jz,homeJzPage).map(j => `<div class="card"><div class="avatar avatar-jinzhu">金主</div><div class="card-content">
        <div class="card-title">${escapeHtml(j.name||j.title||'金主')}</div>
        <div class="card-desc">${escapeHtml(j.industry||'')} ${diffIcon(j.difficulty)}</div>
        <div class="card-desc">${escapeHtml(j.detail||j.desc||'')}</div>
      </div></div>`).join('')
    : '<div class="empty-tip">暂无金主需求</div>';
  if(dsBox) dsBox.innerHTML = paginate(ds,homeDsPage).length
    ? paginate(ds,homeDsPage).map(d => `<div class="card"><div class="avatar avatar-dashi">SI</div><div class="card-content">
        <div class="card-title">${escapeHtml(d.name||d.title||'工具')}</div>
        <div class="card-desc">${escapeHtml(d.category||'')}</div>
        <div class="card-desc">${escapeHtml(d.desc||'')}</div>
      </div></div>`).join('')
    : '<div class="empty-tip">暂无超级智能</div>';
  renderPager('home-jz-pager', homeJzPage, jz.length);
  bindPager('home-jz-pager', p => { homeJzPage=p; renderHome(); });
  renderPager('home-ds-pager', homeDsPage, ds.length);
  bindPager('home-ds-pager', p => { homeDsPage=p; renderHome(); });
}

async function renderFocus(){
  await fetchAll();
  const user = getUser();
  const pid = await getPriorityTeamId(user);
  const el = $('focus-list');
  if(!pid){ el.innerHTML = '<div class="empty-tip">尚未设置最高优先级团队。请在「我的超级团队」中点击 🎯</div>'; return; }
  const t = (cache.team||[]).find(x => Number(x.id)===Number(pid));
  if(!t){ el.innerHTML = '<div class="empty-tip">优先级团队不存在，请重新设置</div>'; return; }
  const linked = (cache.jinzhu||[]).find(j => String(j.id)===String(t.jinzhu_id) || String(j.phone)===String(t.jinzhu_phone));

async function saveJinZhu(id){
  const u=getUser();
  const detail=($('f-detail').value||'').trim();
  if(!detail){ alert('请填写详情'); return; }
  const row={ name:($('f-name').value||'待填').trim(), industry:($('f-industry').value||'待填').trim(),
    detail, desc:detail, difficulty:num($('f-diff').value,0), reward:($('f-reward').value||'0').trim(),
    owner_phone:u.phone, phone:u.phone };
  try{
    if(id) await sb.from('jinzhu').update(row).eq('id',id);
    else { row.id=nowId(); await sb.from('jinzhu').insert(row); }
    closeModal(); await fetchAll(); renderJinZhu(); renderHome();
  }catch(e){ alert('保存失败: '+(e.message||e)); }
